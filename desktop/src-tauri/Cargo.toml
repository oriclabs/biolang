[package]
name = "biolang-desktop"
version = "0.1.0"
description = "Local-first desktop IDE for BioLang"
authors = ["OriC Labs"]
edition = "2021"
license = "MIT"

[lib]
name = "biolang_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
bl-import = { path = "../../crates/bl-import" }
bl-qc = { path = "../../crates/bl-qc" }
bl-refs = { path = "../../crates/bl-refs" }
csv = "1.3"
dirs = "6"
keyring = "4.1.5"
portable-pty = "0.9"
rfd = "0.15"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
toml = "0.8"

[workspace]
