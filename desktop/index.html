<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191c21" />
    <meta name="description" content="BioLang Workbench - an installable bioinformatics IDE with local WebAssembly and remote SOMER execution" />
    <meta name="application-name" content="BioLang Workbench Web" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BioLang" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>BioLang Workbench Web</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        min-width: 320px;
        overflow: hidden;
        color: #d4d9e1;
        background: #101216;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-splash {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background: #101216;
      }

      .boot-splash-content {
        display: grid;
        width: min(320px, calc(100vw - 48px));
        justify-items: center;
        gap: 14px;
      }

      .boot-splash-mark {
        display: grid;
        width: 42px;
        height: 42px;
        place-items: center;
        color: #101614;
        background: #65c7b4;
        border-radius: 7px;
        font-size: 23px;
        font-weight: 750;
      }

      .boot-splash-title {
        color: #edf1f6;
        font-size: 15px;
        font-weight: 680;
      }

      .boot-splash-status {
        color: #8d96a2;
        font-size: 12px;
      }

      .boot-splash-retry {
        display: none;
        height: 29px;
        padding: 0 11px;
        color: #d4d9e1;
        background: #1a1e24;
        border: 1px solid #39414c;
        border-radius: 4px;
        font: inherit;
        cursor: pointer;
      }

      .boot-splash.slow .boot-splash-retry {
        display: block;
      }

      .boot-splash-track {
        width: 100%;
        height: 3px;
        overflow: hidden;
        background: #252a31;
        border-radius: 2px;
      }

      .boot-splash-progress {
        width: 42%;
        height: 100%;
        background: #65c7b4;
        animation: boot-progress 1.25s ease-in-out infinite;
        transform-origin: left;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-110%) scaleX(.55); }
        50% { transform: translateX(95%) scaleX(1); }
        100% { transform: translateX(255%) scaleX(.55); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash-progress {
          width: 65%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" id="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash-content">
          <div class="boot-splash-mark" aria-hidden="true">B</div>
          <div class="boot-splash-title">BioLang Workbench</div>
          <div class="boot-splash-track" role="progressbar" aria-label="Loading BioLang Workbench"><div class="boot-splash-progress"></div></div>
          <div class="boot-splash-status" id="boot-splash-status">Loading application...</div>
          <button class="boot-splash-retry" type="button" onclick="window.location.reload()">Retry</button>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById("boot-splash");
        var status = document.getElementById("boot-splash-status");
        if (splash && status) {
          splash.classList.add("slow");
          status.textContent = "Startup is taking longer than expected.";
        }
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
