[package]
name = "bl-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tree-walking interpreter with 1000+ builtins for BioLang"

[features]
default = ["native"]
native = ["dep:bl-refs", "dep:flate2", "dep:zip", "dep:glob", "dep:ureq", "dep:bl-bio", "dep:bl-apis", "dep:suppaftp", "dep:toml", "dep:dirs", "dep:rusqlite", "dep:parquet", "dep:pdf-extract", "dep:lz4_flex", "dep:ruzstd", "dep:resvg"]
bytecode = ["dep:bl-compiler", "dep:bl-jit"]
jit = ["bytecode", "bl-jit/jit"]

[dependencies]
bl-core = { workspace = true }
bl-lexer = { workspace = true }
bl-parser = { workspace = true }
bl-bio = { workspace = true, optional = true }
bl-apis = { workspace = true, optional = true }
bl-compiler = { workspace = true, optional = true }
bl-jit = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ureq = { version = "2", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", optional = true }
# Blosc inner codecs (zarr chunks). Both are pure Rust, so the AnnData reader
# keeps its no-C-dependency guarantee.
lz4_flex = { version = "0.11", optional = true, default-features = false, features = ["std"] }
ruzstd = { version = "0.7", optional = true }
chrono = "0.4"
glob = { version = "0.3", optional = true }
suppaftp = { version = "6", optional = true, features = ["native-tls"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rustc-hash = "2"
bl-refs = { workspace = true, optional = true }
toml = { version = "0.8", optional = true }
dirs = { version = "5", optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
parquet = { version = "54", optional = true, default-features = false, features = ["snap"] }
pdf-extract = { version = "0.10", optional = true }
# PNG export: rasterises the SVG the plot builtins already produce, rather than
# introducing a second rendering path that could disagree with the first.
# Native only - in the browser the page can rasterise an SVG itself, and the
# font database would be dead weight in the WASM bundle.
resvg = { version = "0.48", optional = true, default-features = false, features = ["text", "system-fonts", "raster-images"] }
# Rasterises the point layer of large scatter plots. One <circle> per cell is
# fine for the 2700 of PBMC3k and ruinous at atlas scale: a million cells is a
# 65 MB string and a million DOM nodes. Pure Rust and no font or system
# dependencies, so unlike resvg it compiles for wasm32 and the browser build
# rasterises exactly as the CLI does.
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "png-format", "simd"] }

[dev-dependencies]
tempfile = "3"
# Decodes the PNGs the export tests write, so they can assert the figure was
# drawn rather than that a file appeared.
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }
base64 = "0.22"
