[package]
name = "bl-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Safe biological and tabular format conversion for BioLang"

[lib]
name = "bl_convert"
path = "src/lib.rs"

[[bin]]
name = "bl-convert"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
