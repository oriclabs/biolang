[package]
name = "bl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for BioLang: run scripts, start REPL, manage plugins"

[features]
default = ["notebook-server", "gpu"]
notebook-server = ["dep:rand", "dep:tiny_http"]
# Passthrough so the shipped binary can be built without the wgpu/naga stack.
# The runtime keeps its deterministic f64 CPU path either way; without this
# feature the GPU probe reports "not compiled" and every call falls back.
gpu = ["bl-runtime/gpu"]

[[bin]]
name = "bl"
path = "src/main.rs"

[dependencies]
bl-core = { workspace = true }
bl-lexer = { workspace = true }
bl-parser = { workspace = true }
bl-runtime = { workspace = true, default-features = false, features = ["native"] }
bl-fmt = { workspace = true }
bl-repl = { workspace = true }
bl-import = { workspace = true }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
rand = { version = "0.9", optional = true }
tiny_http = { version = "0.12", optional = true }

[target.'cfg(windows)'.dependencies]
zip = "2"
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
