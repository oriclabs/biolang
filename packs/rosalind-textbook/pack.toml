# BioLang example pack: Rosalind — Bioinformatics Textbook Track
#
# Not a course companion. See README.md: the point is to show which
# canonical algorithms BioLang already carries as builtins, and where it does
# not. Anyone actually taking the course should implement these themselves.
#
# See packs/rosalind-armory/pack.toml for the field meanings.

[pack]
id = "rosalind-textbook"
name = "Rosalind — Bioinformatics Textbook Track"
version = "0.1.0"
track = "bioinformatics-textbook-track"
description = "The Bioinformatics Textbook Track: 33 of 124 problems, from pattern finding through assembly graphs to alignment."
list_url = "https://rosalind.info/problems/list-view/?location=bioinformatics-textbook-track"
requires = ">=0.4"

license = "MIT"
statements_license = "Problem statements © rosalind.info — paraphrased and linked, not reproduced."

[[problem]]
id = "BA1A"
title = "Compute the Number of Times a Pattern Appears in a Text"
file = "examples/ba1a.bl"
url = "https://rosalind.info/problems/ba1a/"
status = "solved"
asserted = true
topics = ["strings", "motifs"]

[[problem]]
id = "BA1B"
title = "Find the Most Frequent Words in a String"
file = "examples/ba1b.bl"
url = "https://rosalind.info/problems/ba1b/"
status = "solved"
asserted = true
note = "Shows a real distinction: kmer_count() tallies canonical k-mers, pooling each with its reverse complement, so it reports GCAT and ATGC as one count of 4. This problem wants literal occurrences, so it counts the raw windows from kmers()."
topics = ["strings", "kmers"]

[[problem]]
id = "BA1C"
title = "Find the Reverse Complement of a String"
file = "examples/ba1c.bl"
url = "https://rosalind.info/problems/ba1c/"
status = "solved"
asserted = true
topics = ["sequence"]

[[problem]]
id = "BA1D"
title = "Find All Occurrences of a Pattern in a String"
file = "examples/ba1d.bl"
url = "https://rosalind.info/problems/ba1d/"
status = "solved"
asserted = true
topics = ["strings", "motifs"]

[[problem]]
id = "BA1G"
title = "Compute the Hamming Distance Between Two Strings"
file = "examples/ba1g.bl"
url = "https://rosalind.info/problems/ba1g/"
status = "solved"
asserted = true
topics = ["sequence", "mutations"]

[[problem]]
id = "BA3A"
title = "Generate the k-mer Composition of a String"
file = "examples/ba3a.bl"
url = "https://rosalind.info/problems/ba3a/"
status = "solved"
asserted = true
topics = ["kmers", "assembly"]

[[problem]]
id = "BA4A"
title = "Translate an RNA String into an Amino Acid String"
file = "examples/ba4a.bl"
url = "https://rosalind.info/problems/ba4a/"
status = "solved"
asserted = true
topics = ["translation"]

[[problem]]
id = "BA5G"
title = "Compute the Edit Distance Between Two Strings"
file = "examples/ba5g.bl"
url = "https://rosalind.info/problems/ba5g/"
status = "solved"
asserted = true
topics = ["alignment", "edit-distance"]

[[problem]]
id = "BA9G"
title = "Construct the Suffix Array of a String"
file = "examples/ba9g.bl"
url = "https://rosalind.info/problems/ba9g/"
status = "solved"
asserted = true
note = "Suffix arrays were one of three gaps this pack was built to measure. They are a builtin now, which is what LREP and MREP in the Stronghold pack stand on."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "BA1E"
title = "Find Patterns Forming Clumps in a String"
file = "examples/ba1e.bl"
url = "https://rosalind.info/problems/ba1e/"
status = "solved"
asserted = true
note = "A sliding window with a tally inside it. A k-mer qualifies once, so the answers are a set."
topics = ["strings", "motifs"]

[[problem]]
id = "BA1F"
title = "Find a Position in a Genome Minimizing the Skew"
file = "examples/ba1f.bl"
url = "https://rosalind.info/problems/ba1f/"
status = "solved"
asserted = true
note = "A running count of G minus C. The dip marks the replication origin, which is what the problem is about."
topics = ["genomics"]

[[problem]]
id = "BA1H"
title = "Find All Approximate Occurrences of a Pattern"
file = "examples/ba1h.bl"
url = "https://rosalind.info/problems/ba1h/"
status = "solved"
asserted = true
note = "hamming_distance is a builtin, so this is a windowed scan and nothing more."
topics = ["strings", "mutations"]

[[problem]]
id = "BA1I"
title = "Most Frequent Words with Mismatches"
file = "examples/ba1i.bl"
url = "https://rosalind.info/problems/ba1i/"
status = "solved"
asserted = true
note = "The answer need not occur in the text at all. Tallying each window's neighbourhood is the same arithmetic over far fewer strings than testing all 4^k candidates."
topics = ["strings", "kmers"]

[[problem]]
id = "BA1J"
title = "Frequent Words with Mismatches and Reverse Complements"
file = "examples/ba1j.bl"
url = "https://rosalind.info/problems/ba1j/"
status = "solved"
asserted = true
note = "A site can sit on either strand, so a k-mer is credited for its reverse complement too — which is why the winners differ from BA1I on the same input."
topics = ["strings", "kmers"]

[[problem]]
id = "BA1K"
title = "Generate the Frequency Array of a String"
file = "examples/ba1k.bl"
url = "https://rosalind.info/problems/ba1k/"
status = "solved"
asserted = true
note = "Indexed by PatternToNumber, so it lists every possible k-mer including those that never occur. That is what separates it from a tally."
topics = ["kmers"]

[[problem]]
id = "BA1L"
title = "Implement PatternToNumber"
file = "examples/ba1l.bl"
url = "https://rosalind.info/problems/ba1l/"
status = "solved"
asserted = true
note = "k-mers in lexicographic order are the base-4 numbers with A=0, C=1, G=2, T=3."
topics = ["kmers", "encoding"]

[[problem]]
id = "BA1M"
title = "Implement NumberToPattern"
file = "examples/ba1m.bl"
url = "https://rosalind.info/problems/ba1m/"
status = "solved"
asserted = true
note = "The inverse of BA1L."
topics = ["kmers", "encoding"]

[[problem]]
id = "BA1N"
title = "Generate the d-Neighborhood of a String"
file = "examples/ba1n.bl"
url = "https://rosalind.info/problems/ba1n/"
status = "solved"
asserted = true
note = "Grown one position at a time, dropping any prefix that has already spent more than d substitutions."
topics = ["strings", "mutations"]

[[problem]]
id = "BA2A"
title = "Implement MotifEnumeration"
file = "examples/ba2a.bl"
url = "https://rosalind.info/problems/ba2a/"
status = "solved"
asserted = true
note = "A motif need not occur exactly anywhere, so the candidates are the neighbourhoods of the first string's windows: anything qualifying must be within d of one of them."
topics = ["strings", "motifs"]

[[problem]]
id = "BA2B"
title = "Find a Median String"
file = "examples/ba2b.bl"
url = "https://rosalind.info/problems/ba2b/"
status = "solved"
asserted = true
note = "Every k-mer is a candidate, not only those occurring in the strings. Any minimiser is accepted, so the assertion checks the distance rather than the string: this finds ACG where the sample shows GAC, and both score 2."
topics = ["strings", "motifs"]

[[problem]]
id = "BA2C"
title = "Find a Profile-most Probable k-mer"
file = "examples/ba2c.bl"
url = "https://rosalind.info/problems/ba2c/"
status = "solved"
asserted = true
note = "The product down the profile's columns. Every entry here is non-zero so no window is ruled out, which is the situation pseudocounts exist to fix in the problems that follow."
topics = ["motifs", "probability"]

[[problem]]
id = "BA2H"
title = "Implement DistanceBetweenPatternAndStrings"
file = "examples/ba2h.bl"
url = "https://rosalind.info/problems/ba2h/"
status = "solved"
asserted = true
note = "Best per string, summed across them: a motif only has to occur once in each."
topics = ["strings", "motifs"]

[[problem]]
id = "BA3B"
title = "Reconstruct a String from its Genome Path"
file = "examples/ba3b.bl"
url = "https://rosalind.info/problems/ba3b/"
status = "solved"
asserted = true
note = "The path is already ordered, so the string is the first k-mer plus one symbol from each after it. Finding the order is what BA3C and BA3H are for."
topics = ["assembly"]

[[problem]]
id = "BA3C"
title = "Construct the Overlap Graph of a Collection of k-mers"
file = "examples/ba3c.bl"
url = "https://rosalind.info/problems/ba3c/"
status = "solved"
asserted = true
note = "An edge where one k-mer's suffix is another's prefix. Written with `source` and `target` because `from` and `to` are reserved words."
topics = ["assembly", "graphs"]

[[problem]]
id = "BA3D"
title = "Construct the De Bruijn Graph of a String"
file = "examples/ba3d.bl"
url = "https://rosalind.info/problems/ba3d/"
status = "solved"
asserted = true
note = "Nodes are (k-1)-mers and edges are the k-mers, which is the inversion that turns assembly into an Eulerian path problem rather than a Hamiltonian one."
topics = ["assembly", "graphs"]

[[problem]]
id = "BA3E"
title = "Construct the De Bruijn Graph of a Collection of k-mers"
file = "examples/ba3e.bl"
url = "https://rosalind.info/problems/ba3e/"
status = "solved"
asserted = true
note = "The same construction from a bag of reads rather than a string. A duplicate k-mer stays duplicated: it is evidence of a repeat, not noise."
topics = ["assembly", "graphs"]

[[problem]]
id = "BA5A"
title = "Find the Minimum Number of Coins Needed to Make Change"
file = "examples/ba5a.bl"
url = "https://rosalind.info/problems/ba5a/"
status = "solved"
asserted = true
note = "The greedy answer is wrong here and that is the point: taking 25 first needs three coins where 20+20 needs two."
topics = ["dynamic-programming"]

[[problem]]
id = "BA5C"
title = "Find a Longest Common Subsequence of Two Strings"
file = "examples/ba5c.bl"
url = "https://rosalind.info/problems/ba5c/"
status = "solved"
asserted = true
note = "lcs is a builtin. More than one subsequence is longest, so the assertion checks the length and that it really is a subsequence of both."
topics = ["dynamic-programming", "strings"]

[[problem]]
id = "BA5E"
title = "Find a Highest-Scoring Alignment of Two Strings"
file = "examples/ba5e.bl"
url = "https://rosalind.info/problems/ba5e/"
status = "solved"
asserted = true
note = "One call: global, BLOSUM62, linear gap of 5."
topics = ["alignment"]

[[problem]]
id = "BA5F"
title = "Find a Highest-Scoring Local Alignment of Two Strings"
file = "examples/ba5f.bl"
url = "https://rosalind.info/problems/ba5f/"
status = "solved"
asserted = true
note = "PAM250, not BLOSUM62 — the two disagree enough to change the answer, and the problem says which it wants."
topics = ["alignment"]

[[problem]]
id = "BA5H"
title = "Find a Highest-Scoring Fitting Alignment of Two Strings"
file = "examples/ba5h.bl"
url = "https://rosalind.info/problems/ba5h/"
status = "solved"
asserted = true
note = "All of w against any window of v. Semiglobal returns the same number on this input for a different reason — it would clip w's ends too — so a fitting mode was added rather than asserting the coincidence."
topics = ["alignment"]

[[problem]]
id = "BA5I"
title = "Find a Highest-Scoring Overlap Alignment of Two Strings"
file = "examples/ba5i.bl"
url = "https://rosalind.info/problems/ba5i/"
status = "solved"
asserted = true
note = "The shape read assembly asks for: where the end of one read agrees with the start of the next."
topics = ["alignment", "assembly"]

[[problem]]
id = "BA5J"
title = "Align Two Strings Using Affine Gap Penalties"
file = "examples/ba5j.bl"
url = "https://rosalind.info/problems/ba5j/"
status = "solved"
asserted = true
note = "Charging for opening a gap and less per symbol after is what stops one long insertion being priced as a run of unrelated ones."
topics = ["alignment"]

[[problem]]
id = "BA8A"
title = "Implement FarthestFirstTraversal"
file = "examples/ba8a.bl"
url = "https://rosalind.info/problems/ba8a/"
status = "solved"
asserted = true
note = "Each new center is the point furthest from all chosen so far. Deterministic, unlike k-means, which is why it is used to seed clustering rather than to do it."
topics = ["clustering"]

[[problem]]
id = "BA8B"
title = "Compute the Squared Error Distortion"
file = "examples/ba8b.bl"
url = "https://rosalind.info/problems/ba8b/"
status = "solved"
asserted = true
note = "Squared, so one badly placed point counts for far more than several slightly-off ones. This is the quantity k-means minimises."
topics = ["clustering"]

[[problem]]
id = "BA8C"
title = "Implement the Lloyd Algorithm for k-Means Clustering"
file = "examples/ba8c.bl"
url = "https://rosalind.info/problems/ba8c/"
status = "solved"
asserted = true
note = "Assign, then move each center to the mean of what it was assigned, until nothing moves. Seeded with the first k points because Lloyd's converges differently from different seeds — which is what BA8A exists to address."
topics = ["clustering"]

[[problem]]
id = "BA9D"
title = "Find the Longest Repeat in a String"
file = "examples/ba9d.bl"
url = "https://rosalind.info/problems/ba9d/"
status = "solved"
asserted = true
note = "The largest entry in the LCP array, and nothing else. Two suffixes sharing a long prefix is what a repeat is, so the array has already found every one of them before the problem is read."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "BA9E"
title = "Find the Longest Substring Shared by Two Strings"
file = "examples/ba9e.bl"
url = "https://rosalind.info/problems/ba9e/"
status = "solved"
asserted = true
note = "Concatenate with a separator, then take the largest LCP between neighbouring suffixes that came from different sides. The separator is load-bearing: without it a match can run across the join and name a substring neither string contains."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "BA9I"
title = "Construct the Burrows-Wheeler Transform of a String"
file = "examples/ba9i.bl"
url = "https://rosalind.info/problems/ba9i/"
status = "solved"
asserted = true
note = "Sorting rotations and sorting suffixes agree once the string ends in a sentinel, so the suffix array gives the transform directly — the character before each sorted suffix."
topics = ["strings", "suffix-structures", "compression"]

[[problem]]
id = "BA9J"
title = "Reconstruct a String from its Burrows-Wheeler Transform"
file = "examples/ba9j.bl"
url = "https://rosalind.info/problems/ba9j/"
status = "solved"
asserted = true
note = "The k-th occurrence of a symbol in the first column is the k-th in the last. That correspondence alone rebuilds the text, which is why the transform can be stored without anything beside it."
topics = ["strings", "suffix-structures", "compression"]

[[problem]]
id = "BA10A"
title = "Compute the Probability of a Hidden Path"
file = "examples/ba10a.bl"
url = "https://rosalind.info/problems/ba10a/"
status = "solved"
asserted = true
note = "One product of fifty transitions, which lands at 1e-19 — the concrete reason the decoding problems that follow are done in log space rather than directly."
topics = ["hmm", "probability"]

[[problem]]
id = "BA10B"
title = "Compute the Probability of an Outcome Given a Hidden Path"
file = "examples/ba10b.bl"
url = "https://rosalind.info/problems/ba10b/"
status = "solved"
asserted = true
note = "Conditioning on the path makes the positions independent, so the transitions never enter into it. Checked against the same product taken by hand."
topics = ["hmm", "probability"]

[[problem]]
id = "BA10C"
title = "Implement the Viterbi Algorithm"
file = "examples/ba10c.bl"
url = "https://rosalind.info/problems/ba10c/"
status = "solved"
asserted = true
note = "The problem this pack was built to reach: HMM decoding is what gene finders, profile search and segmentation all run on, and nothing in the tree could do it before."
topics = ["hmm", "dynamic-programming"]

[[problem]]
id = "BA10D"
title = "Compute the Probability of a String Emitted by an HMM"
file = "examples/ba10d.bl"
url = "https://rosalind.info/problems/ba10d/"
status = "solved"
asserted = true
note = "The forward algorithm. Its assertion enumerates all 1024 paths of the sample and sums them, so the collapse is checked against the thing it replaces rather than only against a published number."
topics = ["hmm", "dynamic-programming"]

[[problem]]
id = "BA10J"
title = "Solve the Soft Decoding Problem"
file = "examples/ba10j.bl"
url = "https://rosalind.info/problems/ba10j/"
status = "solved"
asserted = true
note = "Forward-backward, which answers a different question from Viterbi: the most likely state at each position need not lie on any single path the model can produce."
topics = ["hmm", "dynamic-programming"]

[[problem]]
id = "BA10H"
title = "Estimate the Parameters of an HMM"
file = "examples/ba10h.bl"
url = "https://rosalind.info/problems/ba10h/"
status = "solved"
asserted = true
note = "With the path given there is nothing to infer — the best estimate is the fraction of the time each move was made. A state the path never visits keeps a uniform row, which is the only choice that leaves it a distribution."
topics = ["hmm", "parameter-estimation"]

[[problem]]
id = "BA10I"
title = "Implement Viterbi Learning"
file = "examples/ba10i.bl"
url = "https://rosalind.info/problems/ba10i/"
status = "solved"
asserted = true
note = "Decode, re-estimate as if that path were the truth, repeat. Climbs to a local optimum, so where it starts is part of the problem rather than an implementation detail."
topics = ["hmm", "parameter-estimation"]

[[problem]]
id = "BA10K"
title = "Implement Baum-Welch Learning"
file = "examples/ba10k.bl"
url = "https://rosalind.info/problems/ba10k/"
status = "solved"
asserted = true
note = "Expectation-maximisation: counts the expected number of times each transition was taken over every path at once, instead of committing to the best one. Its assertion checks the likelihood rises round by round, not only end to end."
topics = ["hmm", "parameter-estimation"]

[[problem]]
id = "BA10E"
title = "Construct a Profile HMM"
file = "examples/ba10e.bl"
url = "https://rosalind.info/problems/ba10e/"
status = "solved"
asserted = true
note = "A family of sequences becomes something a new sequence can be scored against — what Pfam and HMMER search with. Conserved columns become match states; gappy ones become insertions, which keeps the model's length at the family's length rather than the alignment's."
topics = ["hmm", "profile-hmm", "alignment"]

[[problem]]
id = "BA10F"
title = "Construct a Profile HMM with Pseudocounts"
file = "examples/ba10f.bl"
url = "https://rosalind.info/problems/ba10f/"
status = "solved"
asserted = true
note = "Without a pseudocount, anything six sequences never happened to do is scored as impossible. It is added after the counts become probabilities, not before — added to raw counts its influence would depend on how many sequences the alignment contains."
topics = ["hmm", "profile-hmm"]

[[problem]]
id = "BA10G"
title = "Perform a Multiple Sequence Alignment with a Profile HMM"
file = "examples/ba10g.bl"
url = "https://rosalind.info/problems/ba10g/"
status = "solved"
asserted = true
note = "Viterbi cannot do this: deletion states are silent, so nine states emit seven symbols. The silent states have to be settled in layer order at each position before the emitting ones look back at them."
topics = ["hmm", "profile-hmm", "alignment"]

[[problem]]
id = "BA2D"
title = "Implement GreedyMotifSearch"
file = "examples/ba2d.bl"
url = "https://rosalind.info/problems/ba2d/"
status = "solved"
asserted = true
note = "Greedy in the strict sense: each string picks what the current profile likes best and nothing is reconsidered. Fast, and wrong often enough that BA2E exists."
topics = ["motifs", "greedy"]

[[problem]]
id = "BA2E"
title = "Implement GreedyMotifSearch with Pseudocounts"
file = "examples/ba2e.bl"
url = "https://rosalind.info/problems/ba2e/"
status = "solved"
asserted = true
note = "One number different from BA2D. Without a pseudocount a base absent from a column makes every k-mer containing it impossible rather than unlikely. On this five-string sample the two versions actually tie at a score of 2 — the assertion says so rather than claiming an improvement the data does not show."
topics = ["motifs", "greedy"]

[[problem]]
id = "BA2F"
title = "Implement RandomizedMotifSearch"
file = "examples/ba2f.bl"
url = "https://rosalind.info/problems/ba2f/"
status = "solved"
asserted = true
note = "Seeded so the example is reproducible. Graded on the score reached rather than on one particular set, because several distinct sets tie at the optimum of 9 — asserting on the published one would be asserting on the seed."
topics = ["motifs", "randomized"]

[[problem]]
id = "BA2G"
title = "Implement GibbsSampler"
file = "examples/ba2g.bl"
url = "https://rosalind.info/problems/ba2g/"
status = "solved"
asserted = true
note = "Replaces one motif at a time rather than all of them, and draws in proportion to probability instead of taking the best — which is what lets it leave a local optimum. Rosalind's suggested 20 starts settles at 10 here; 200 reaches the optimal 9."
topics = ["motifs", "randomized"]

[[problem]]
id = "BA3F"
title = "Find an Eulerian Cycle in a Graph"
file = "examples/ba3f.bl"
url = "https://rosalind.info/problems/ba3f/"
status = "solved"
asserted = true
note = "Hierholzer's algorithm, linear in the edges. Asserted on the property — every edge used exactly once, every step a real edge — rather than on the published string, which is one rotation among many."
topics = ["graphs", "assembly"]

[[problem]]
id = "BA3G"
title = "Find an Eulerian Path in a Graph"
file = "examples/ba3g.bl"
url = "https://rosalind.info/problems/ba3g/"
status = "solved"
asserted = true
note = "Add the edge between the two unbalanced nodes, find a cycle, then cut the added edge out again. Which node the walk starts and ends at is forced by the degrees, so those are asserted exactly."
topics = ["graphs", "assembly"]

[[problem]]
id = "BA3H"
title = "Reconstruct a String from its k-mer Composition"
file = "examples/ba3h.bl"
url = "https://rosalind.info/problems/ba3h/"
status = "solved"
asserted = true
note = "Reads become edges, not nodes — which makes assembly an Eulerian path, solvable in linear time. Reads as nodes would give a Hamiltonian path instead: the same data, a different graph, and the difference between tractable and NP-hard."
topics = ["assembly", "graphs"]

[[problem]]
id = "BA3I"
title = "Find a k-Universal Circular String"
file = "examples/ba3i.bl"
url = "https://rosalind.info/problems/ba3i/"
status = "solved"
asserted = true
note = "Every (k-1)-mer has two edges in and two out, so the graph is balanced and the walk closes. Returns a different valid string from the published one; the assertion reads around the circle and checks all 2^k k-mers appear exactly once."
topics = ["assembly", "graphs", "combinatorics"]

[[problem]]
id = "BA3J"
title = "Reconstruct a String from its Paired Composition"
file = "examples/ba3j.bl"
url = "https://rosalind.info/problems/ba3j/"
status = "solved"
asserted = true
note = "Paired reads pin down a repeat that either read alone would be ambiguous inside. The two halves must agree wherever they overlap, and checking that agreement is what makes a wrong assembly detectable."
topics = ["assembly", "graphs"]
