asserted = true
note = "The two trees here share no nontrivial split, so the distance is 2(n-3) = 6; the splits of each are printed so that is checkable by eye. The assertion also requires a tree compared with itself to give 0, which tests the canonical split orientation rather than just the arithmetic."
topics = ["phylogeny", "newick"]

[[problem]]
id = "CONV"
