# BioLang example pack: Rosalind — Bioinformatics Stronghold
#
# In progress: the Stronghold has 107 problems and this pack currently carries
# fifteen of them. Problems are added only once they reproduce the official
# sample answer and carry a `test_*` assertion, so this pack's coverage number
# is always the number actually verified rather than the number attempted.
#
# See packs/rosalind-armory/pack.toml for the field meanings.

[pack]
id = "rosalind-stronghold"
name = "Rosalind — Bioinformatics Stronghold"
version = "0.1.0"
track = "bioinformatics-stronghold"
description = "Worked solutions to the Rosalind Bioinformatics Stronghold, 79 of 107 problems so far."
list_url = "https://rosalind.info/problems/list-view/"
requires = ">=0.4"

license = "MIT"
statements_license = "Problem statements © rosalind.info — paraphrased and linked, not reproduced."

[[problem]]
id = "DNA"
title = "Counting DNA Nucleotides"
