file = "examples/conv.bl"
url = "https://rosalind.info/problems/conv/"
status = "solved"
asserted = true
note = "Both spectra repeat a mass, so the winning difference (149.06586) arises four ways; the example prints that reasoning. The assertion also pins the three hand-checked occurrences of 85.03163 and the size of the convolution."
topics = ["mass-spectrometry"]

[[problem]]
id = "PCOV"
