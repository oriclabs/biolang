title = "Semiglobal Alignment"
file = "examples/smgb.bl"
url = "https://rosalind.info/problems/smgb/"
status = "solved"
asserted = true
note = "Semiglobal is one of the two alignment modes added for this pack; before that the problem could not be expressed at all."
topics = ["alignment"]

[[problem]]
id = "MGAP"
title = "Maximizing the Gap Symbols of an Optimal Alignment"
file = "examples/mgap.bl"
url = "https://rosalind.info/problems/mgap/"
status = "solved"
asserted = true
note = "The scoring is deliberately unspecified, which is the hint: a maximum-score alignment matches as much as it can, so the answer falls out of the longest common subsequence."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "CSTR"
title = "Creating a Character Table from Genetic Strings"
file = "examples/cstr.bl"
url = "https://rosalind.info/problems/cstr/"
status = "solved"
asserted = true
note = "A split is nontrivial only when both sides hold at least two strings; a position where one string differs from all the others separates nothing. Which state is written as 1 is arbitrary, so the assertion accepts a row or its complement."
topics = ["phylogeny", "character-tables"]

[[problem]]
id = "SUFF"
title = "Encoding Suffix Trees"
file = "examples/suff.bl"
url = "https://rosalind.info/problems/suff/"
status = "solved"
asserted = true
note = "Built from the suffix array and LCP array rather than by collapsing a trie. Both give the same tree; a trie of all suffixes has O(n^2) nodes first, whereas the arrays are linear — which is why aligners store the arrays and never materialise the tree."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "SGRA"
title = "Using the Spectrum Graph to Infer Peptides"
file = "examples/sgra.bl"
url = "https://rosalind.info/problems/sgra/"
status = "solved"
asserted = true
note = "Monoisotopic masses, so differences are matched within a tolerance rather than exactly. The graph is a DAG since masses only increase, so the longest path is one scan in sorted order instead of an exponential search."
topics = ["mass-spectrometry", "graphs"]

[[problem]]
id = "FULL"
title = "Inferring Peptide from Full Spectrum"
file = "examples/full.bl"
url = "https://rosalind.info/problems/full/"
status = "solved"
asserted = true
note = "A peptide fragments from both ends at once, so a b-ion and its y-ion sum to the parent mass and the list mixes them unlabelled. It does not matter which is which — taking an ion spends its complement, since a prefix and its suffix are one event and cannot both extend the chain."
topics = ["mass-spectrometry"]

[[problem]]
id = "ALPH"
title = "Alignment-Based Phylogeny"
file = "examples/alph.bl"
url = "https://rosalind.info/problems/alph/"
status = "solved"
asserted = true
note = "Small parsimony with the gap as a fifth symbol rather than a missing value — in an alignment a gap is evidence that an indel happened, and treating it as unknown would make every column containing one free. Finds a different labelling of equal score, so the assertion recounts the changes."
topics = ["phylogeny", "alignment"]

[[problem]]
id = "GASM"
title = "Genome Assembly Using Reads"
file = "examples/gasm.bl"
url = "https://rosalind.info/problems/gasm/"
status = "solved"
asserted = true
note = "A read gives no clue which strand it came from, so the graph holds every read and its reverse complement and falls into two mirror cycles. Returns AATCTGT — a rotation of the reverse complement of GATTACA, which the assertion checks up to both rotation and strand."
topics = ["assembly", "graphs"]

[[problem]]
id = "MULT"
title = "Multiple Alignment"
file = "examples/mult.bl"
url = "https://rosalind.info/problems/mult/"
status = "solved"
asserted = true
note = "Four sequences need a hypercube and 2^k-1 moves out of every cell — fifteen here, against three for a pairwise alignment. Exact multiple alignment costs O(n^k), which is why every tool that aligns hundreds of sequences is approximating."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "GREP"
title = "Genome Assembly with Perfect Coverage and Repeats"
file = "examples/grep.bl"
url = "https://rosalind.info/problems/grep/"
status = "solved"
asserted = true
note = "PCOV returns one answer; this is the honest version. Repeats make the Eulerian cycle non-unique and all six cycles are genomes consistent with the reads — so the reads do not determine the chromosome, and reporting one would be picking arbitrarily."
topics = ["assembly", "graphs"]

[[problem]]
id = "MPRT"
title = "Finding a Protein Motif"
file = "examples/mprt.bl"
url = "https://rosalind.info/problems/mprt/"
status = "solved"
network = true
asserted = true
note = "Fetches from UniProt, so it runs in the advisory job rather than the hermetic gate. The motif matcher itself is asserted offline — N{P}[ST]{P} has alternatives and exclusions, so it is a pattern rather than a substring search."
topics = ["motifs", "databases"]

[[problem]]
id = "OSYM"
title = "Isolating Symbols in Alignments"
file = "examples/osym.bl"
url = "https://rosalind.info/problems/osym/"
status = "solved"
asserted = true
note = "The best alignment through a given pairing is the best way of reaching it plus the best way of leaving it, so one forward table and one backward table answer all 49 pairs at once — the same trick BA5K uses to find a middle edge."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "ITWV"
title = "Finding Disjoint Motifs in a Gene"
file = "examples/itwv.bl"
url = "https://rosalind.info/problems/itwv/"
status = "solved"
asserted = true
note = "Two motifs competing for the same characters, which is what makes this different from finding each separately. Every reachable state must consume the current character or the window ends — carrying one forward unconsumed would let the motifs match unrelated parts of the sequence."
topics = ["motifs", "dynamic-programming"]

[[problem]]
id = "CNTQ"
title = "Counting Quartets"
file = "examples/cntq.bl"
url = "https://rosalind.info/problems/cntq/"
status = "solved"
asserted = true
note = "The answer is C(n,4), and the reason matters more than the number: in a fully resolved tree any four taxa are separated into two pairs by some edge, so the shape never enters into it. The assertion enumerates all 15 subsets and confirms it rather than trusting the formula."
topics = ["phylogeny", "combinatorics"]

[[problem]]
id = "QRT"
title = "Quartets"
file = "examples/qrt.bl"
url = "https://rosalind.info/problems/qrt/"
status = "solved"
asserted = true
note = "An 'x' means not scored, not a third state — so a partial character still separates the taxa it did see, and missing data does not make it useless. Quartets are recorded canonically because neither side nor the order within a side carries meaning, and two characters often support the same one."
topics = ["phylogeny"]
