# BioLang example pack: Rosalind — Bioinformatics Stronghold
#
# In progress: the Stronghold has 107 problems and this pack currently carries
# fifteen of them. Problems are added only once they reproduce the official
# sample answer and carry a `test_*` assertion, so this pack's coverage number
# is always the number actually verified rather than the number attempted.
#
# See packs/rosalind-armory/pack.toml for the field meanings.

[pack]
id = "rosalind-stronghold"
name = "Rosalind — Bioinformatics Stronghold"
version = "0.1.0"
track = "bioinformatics-stronghold"
description = "Worked solutions to all 105 problems of the Rosalind Bioinformatics Stronghold."
list_url = "https://rosalind.info/problems/list-view/"
requires = ">=0.4"

license = "MIT"
statements_license = "Problem statements © rosalind.info — paraphrased and linked, not reproduced."

[[problem]]
id = "DNA"
title = "Counting DNA Nucleotides"
file = "examples/dna.bl"
url = "https://rosalind.info/problems/dna/"
status = "solved"
asserted = true
note = "A warm-up for the site's input format rather than a biological question — but the four counts it produces are exactly what GC content is computed from, and a lopsided base composition is the first thing a QC tool flags as contamination or adapter read-through."
topics = ["sequence", "counting"]

[[problem]]
id = "RNA"
title = "Transcribing DNA into RNA"
file = "examples/rna.bl"
url = "https://rosalind.info/problems/rna/"
status = "solved"
asserted = true
note = "One character substituted for another, which is a fair summary of transcription only if you ignore splicing, capping and polyadenylation. SPLC covers the part this leaves out."
topics = ["sequence", "transcription"]

[[problem]]
id = "REVC"
title = "Complementing a Strand of DNA"
file = "examples/revc.bl"
url = "https://rosalind.info/problems/revc/"
status = "solved"
asserted = true
note = "The most-used operation in the whole track. A read carries no record of which strand it came from, so a motif present on one strand appears as its reverse complement on the other — which is why REVP, BA6E and GASM all have to search both."
topics = ["sequence"]

[[problem]]
id = "HAMM"
title = "Counting Point Mutations"
file = "examples/hamm.bl"
url = "https://rosalind.info/problems/hamm/"
status = "solved"
asserted = true
note = "Counts differing positions, which undercounts mutations: a site can change and change back, leaving no trace. RSUB shows exactly that happening, and it is why distance models correct for unseen substitutions rather than using raw counts."
topics = ["sequence", "mutations"]

[[problem]]
id = "FIB"
title = "Rabbits and Recurrence Relations"
file = "examples/fib.bl"
url = "https://rosalind.info/problems/fib/"
status = "solved"
asserted = true
note = "A recurrence-relation exercise wearing rabbits, not population biology — nothing here dies, competes or mutates. WFMD and EBIN are where real population dynamics appear."
topics = ["combinatorics", "recurrence"]

[[problem]]
id = "GC"
title = "Computing GC Content"
file = "examples/gc.bl"
url = "https://rosalind.info/problems/gc/"
status = "solved"
asserted = true
note = "GC content ranges from about 16 to 75 percent across bacteria, and a difference under 5 percent is taken as evidence of the same species — which is why a fragment's GC content alone narrows down where it came from. It also biases sequencing: GC-rich regions amplify poorly and end up under-covered."
topics = ["sequence", "fasta"]

[[problem]]
id = "PROT"
title = "Translating RNA into Protein"
file = "examples/prot.bl"
url = "https://rosalind.info/problems/prot/"
status = "solved"
asserted = true
note = "Sixty-four codons encode twenty amino acids and a stop, so the code is degenerate and translation discards information. MRNA counts exactly how much."
topics = ["translation"]

[[problem]]
id = "SUBS"
title = "Finding a Motif in DNA"
file = "examples/subs.bl"
url = "https://rosalind.info/problems/subs/"
status = "solved"
asserted = true
note = "Finding every occurrence, overlaps included, because real motifs do overlap. The motifs worth finding are restriction sites (REVP) and binding sites — though a real binding site is a tendency rather than a fixed string, which KSIM and MPRT address."
topics = ["motifs"]

[[problem]]
id = "FIBD"
title = "Mortal Fibonacci Rabbits"
file = "examples/fibd.bl"
url = "https://rosalind.info/problems/fibd/"
status = "solved"
asserted = true
note = "FIB with a death clock added. Still a recurrence exercise rather than population biology, and useful mainly for showing that the state has to widen from one number to an age profile."
topics = ["combinatorics", "recurrence"]

[[problem]]
id = "IPRB"
title = "Mendel's First Law"
file = "examples/iprb.bl"
url = "https://rosalind.info/problems/iprb/"
status = "solved"
asserted = true
note = "Mendel's first law as a probability question. The whole content is that two alleles segregate independently, which is what makes the offspring distribution a product rather than something requiring simulation."
topics = ["probability", "genetics"]

[[problem]]
id = "IEV"
title = "Calculating Expected Offspring"
file = "examples/iev.bl"
url = "https://rosalind.info/problems/iev/"
status = "solved"
asserted = true
note = "Expectation is linear whether or not the events are independent, so the answer is a weighted sum with no interaction between genotypes to model. That property is why expected values are reached for far more often than full distributions."
topics = ["probability", "genetics"]

[[problem]]
id = "MRNA"
title = "Inferring mRNA from Protein"
file = "examples/mrna.bl"
url = "https://rosalind.info/problems/mrna/"
status = "solved"
asserted = true
note = "The reverse of PROT, and it cannot be done — the code is degenerate, so a protein maps back to many mRNAs. Leucine, serine and arginine take six codons each. Counting them needs a modulus because the total outgrows any integer."
topics = ["combinatorics", "translation"]

[[problem]]
id = "PRTM"
title = "Calculating Protein Mass"
file = "examples/prtm.bl"
url = "https://rosalind.info/problems/prtm/"
status = "solved"
asserted = true
note = "Monoisotopic masses, which is what a high-resolution instrument reports when it can resolve individual isotope peaks; low-resolution and high-mass measurements give average masses instead, differing by roughly 0.06 percent. Everything in the mass-spectrometry chapter rests on this sum."
topics = ["protein", "mass-spectrometry"]

[[problem]]
id = "PERM"
title = "Enumerating Gene Orders"
file = "examples/perm.bl"
url = "https://rosalind.info/problems/perm/"
status = "solved"
asserted = true
note = "Permutations as gene orders. n! grows fast enough that enumeration stops being possible almost immediately, which is the premise SIGN, REAR and SORT build on — there, gene order is the data and the question is how few reversals separate two of them."
topics = ["combinatorics"]

[[problem]]
id = "PPER"
title = "Partial Permutations"
file = "examples/pper.bl"
url = "https://rosalind.info/problems/pper/"
status = "solved"
asserted = true
note = "Ordered selections rather than full orderings, taken modulo a million because the count outgrows the answer format long before it outgrows the biology. Combinatorial groundwork for the counting problems, not a biological question in itself."
topics = ["combinatorics"]

[[problem]]
id = "EDIT"
title = "Edit Distance"
file = "examples/edit.bl"
url = "https://rosalind.info/problems/edit/"
status = "solved"
asserted = true
note = "The crude version of sequence comparison, and the pack refines it twice: GLOB stops treating every substitution as equally costly, and GAFF stops treating a gap of k bases as k separate events. Useful mainly as the baseline those two improve on."
topics = ["alignment", "edit-distance"]

[[problem]]
id = "GLOB"
title = "Global Alignment with Scoring Matrix"
file = "examples/glob.bl"
url = "https://rosalind.info/problems/glob/"
status = "solved"
asserted = true
note = "BLOSUM62 is built from substitution frequencies actually observed in aligned protein blocks, so swapping a residue for a chemically similar one costs little and swapping it for an unrelated one costs a lot. That is the information EDIT throws away by charging one for every mismatch."
topics = ["alignment", "blosum62"]

[[problem]]
id = "LOCA"
title = "Local Alignment with Scoring Matrix"
file = "examples/loca.bl"
url = "https://rosalind.info/problems/loca/"
status = "solved"
asserted = true
note = "Two proteins may share a single conserved domain inside otherwise unrelated sequence. A global alignment has to align the unrelated parts too and buries the signal; local alignment reports only the stretch that matches, which is what makes it the basis of database search."
topics = ["alignment", "pam250"]

[[problem]]
id = "GAFF"
title = "Global Alignment with Scoring Matrix and Affine Gap Penalty"
file = "examples/gaff.bl"
url = "https://rosalind.info/problems/gaff/"
status = "solved"
asserted = true
note = "One insertion of ten bases is a single mutational event, not ten. Charging per base makes an aligner scatter several short gaps where one long gap is right, so opening a gap costs more than extending it."
topics = ["alignment", "affine-gaps"]

[[problem]]
id = "OAP"
title = "Overlap Alignment"
file = "examples/oap.bl"
url = "https://rosalind.info/problems/oap/"
status = "solved"
asserted = true
slow = true
note = "Brute-force DP over lists; ~9 s. A flat-buffer implementation would be the natural follow-up."
topics = ["alignment", "overlap"]

[[problem]]
id = "SSET"
title = "Counting Subsets"
file = "examples/sset.bl"
url = "https://rosalind.info/problems/sset/"
status = "solved"
asserted = true
note = "Two to the n, which is the point. Any method that examines every subset of a set of sites stops being usable in the low twenties, and that is the wall the search problems elsewhere in this pack are built to avoid."
topics = ["combinatorics"]

[[problem]]
id = "PMCH"
title = "Perfect Matchings and RNA Secondary Structures"
file = "examples/pmch.bl"
url = "https://rosalind.info/problems/pmch/"
status = "solved"
asserted = true
note = "RNA folds back on itself and pairs. This counts the ways every base could be paired, which requires the A and U counts to match and the C and G counts to match — a condition real sequences rarely satisfy, which is what MMCH addresses."
topics = ["combinatorics", "rna-structure"]

[[problem]]
id = "MMCH"
title = "Maximum Matchings and RNA Secondary Structures"
file = "examples/mmch.bl"
url = "https://rosalind.info/problems/mmch/"
status = "solved"
asserted = true
note = "PMCH without the assumption that everything pairs. Real RNA leaves bases unpaired because the counts do not match, so the question becomes how many bonds are possible rather than how many arrangements are complete."
topics = ["combinatorics", "rna-structure"]

[[problem]]
id = "CAT"
title = "Catalan Numbers and RNA Secondary Structures"
file = "examples/cat.bl"
url = "https://rosalind.info/problems/cat/"
status = "solved"
asserted = true
note = "Catalan numbers count matchings that do not cross, and non-crossing is a physical constraint rather than a mathematical convenience: crossing bonds are pseudoknots, which this model excludes. MOTZ relaxes the requirement that everything pairs, and RNAS adds wobble bonds and a minimum hairpin turn."
topics = ["combinatorics", "rna-structure", "dynamic-programming"]

[[problem]]
id = "LIA"
title = "Independent Alleles"
file = "examples/lia.bl"
url = "https://rosalind.info/problems/lia/"
status = "solved"
asserted = true
note = "Mendel's second law. Alleles at different loci assort independently, so the two-locus probability factors — which is what makes this a binomial calculation rather than a simulation."
topics = ["probability", "genetics"]

[[problem]]
id = "SEXL"
title = "Sex-Linked Inheritance"
file = "examples/sexl.bl"
url = "https://rosalind.info/problems/sexl/"
status = "solved"
asserted = true
note = "Males carry one X, so a recessive allele on it is expressed with no second copy to mask it. The proportion of affected males is therefore the allele frequency itself, which is why X-linked recessive conditions appear far more often in males than females."
topics = ["probability", "genetics"]

[[problem]]
id = "AFRQ"
title = "Counting Disease Carriers"
file = "examples/afrq.bl"
url = "https://rosalind.info/problems/afrq/"
status = "solved"
asserted = true
note = "Hardy-Weinberg run backwards: the disease frequency gives the allele frequency, and the carrier frequency 2pq follows. For a rare recessive allele carriers vastly outnumber sufferers, which is the counterintuitive result the arithmetic exists to make obvious."
topics = ["probability", "hardy-weinberg"]

[[problem]]
id = "PROB"
title = "Introduction to Random Strings"
file = "examples/prob.bl"
url = "https://rosalind.info/problems/prob/"
status = "solved"
asserted = true
note = "Computed in logarithms because the raw probability of any particular long string underflows to zero — the same reason the HMM problems decode in log space rather than multiplying probabilities directly."
topics = ["probability", "gc-content"]

[[problem]]
id = "LEXF"
title = "Enumerating k-mers Lexicographically"
file = "examples/lexf.bl"
url = "https://rosalind.info/problems/lexf/"
status = "solved"
asserted = true
note = "Enumerating every k-mer over an alphabet, which is 4 to the k for DNA. Fine at k=3 and hopeless by k=20, which is why the k-mer problems index sequences rather than enumerate possibilities."
topics = ["combinatorics", "strings"]

[[problem]]
id = "LCSM"
title = "Finding a Shared Motif"
file = "examples/lcsm.bl"
url = "https://rosalind.info/problems/lcsm/"
status = "solved"
asserted = true
note = "Any longest common substring is a valid answer, so the assertion checks the length and that the motif really is shared, not one particular string."
topics = ["motifs", "strings"]

[[problem]]
id = "TRAN"
title = "Transitions and Transversions"
file = "examples/tran.bl"
url = "https://rosalind.info/problems/tran/"
status = "solved"
asserted = true
note = "A random mutation process would give a ratio near 0.5, since there are twice as many ways to make a transversion. Real human data sits near 2.1 genome-wide and near 3 in exomes, largely because methylated cytosine deaminates to thymine. The ratio is therefore a standard quality check: a callset far from those values is reporting sequencing error rather than biology."
topics = ["sequence", "mutations"]

[[problem]]
id = "SPLC"
title = "RNA Splicing"
file = "examples/splc.bl"
url = "https://rosalind.info/problems/splc/"
status = "solved"
asserted = true
note = "What RNA glossed over. A eukaryotic gene is not a contiguous coding sequence — introns are cut out before translation, so the protein comes from the exons joined together. Removing the introns first is the difference between the right protein and nonsense."
topics = ["translation", "splicing"]

[[problem]]
id = "CONS"
title = "Consensus and Profile"
file = "examples/cons.bl"
url = "https://rosalind.info/problems/cons/"
status = "solved"
asserted = true
note = "A profile is the same object BA2's motif search builds and scores against: counts per base per position. The consensus reads off the commonest base at each, which is a useful summary and a lossy one — it discards how strong the preference was."
topics = ["sequence", "profile"]

[[problem]]
id = "GRPH"
title = "Overlap Graphs"
file = "examples/grph.bl"
url = "https://rosalind.info/problems/grph/"
status = "solved"
asserted = true
note = "Overlap graphs make reads the nodes, which makes assembly a Hamiltonian path — NP-hard. DBRU makes reads the edges instead and gets an Eulerian path, solvable in linear time. Same data, different graph, and the whole reason modern assemblers use de Bruijn graphs."
topics = ["graphs", "assembly"]

[[problem]]
id = "REVP"
title = "Locating Restriction Sites"
file = "examples/revp.bl"
url = "https://rosalind.info/problems/revp/"
status = "solved"
asserted = true
note = "Restriction enzymes cut at reverse palindromes because they bind as symmetric dimers, one subunit per strand, so the site reads the same on both. That is why these particular sequences matter and why they are always even in length."
topics = ["sequence", "palindromes"]

[[problem]]
id = "TREE"
title = "Completing a Tree"
file = "examples/tree.bl"
url = "https://rosalind.info/problems/tree/"
status = "solved"
asserted = true
note = "A tree on n nodes has exactly n-1 edges, so the answer is that count minus the edges already present, with no search involved. The point is recognising the invariant rather than exploring the graph."
topics = ["phylogeny", "graphs"]

[[problem]]
id = "INOD"
title = "Counting Phylogenetic Ancestors"
file = "examples/inod.bl"
url = "https://rosalind.info/problems/inod/"
status = "solved"
asserted = true
note = "An unrooted binary tree with n leaves always has n-2 internal nodes, whatever its shape. That fixed relationship is what lets EUBT count trees by insertion and CNTQ count quartets without ever examining a topology."
topics = ["phylogeny"]

[[problem]]
id = "SIGN"
title = "Enumerating Oriented Gene Orderings"
file = "examples/sign.bl"
url = "https://rosalind.info/problems/sign/"
status = "solved"
asserted = true
note = "Signed permutations: 2^n times n! of them, because each gene may also be flipped. The sign is not decoration — a reversed gene reads on the opposite strand, which is exactly what REAR and SORT measure."
topics = ["combinatorics"]

[[problem]]
id = "LGIS"
title = "Longest Increasing Subsequence"
file = "examples/lgis.bl"
url = "https://rosalind.info/problems/lgis/"
status = "solved"
asserted = true
note = "Longest increasing subsequence, which in a genomic setting is how conserved order is recovered from a comparison of two genomes: positions that stay in ascending order form a synteny block, and the rest is rearrangement."
topics = ["dynamic-programming"]

[[problem]]
id = "SSEQ"
title = "Finding a Spliced Motif"
file = "examples/sseq.bl"
url = "https://rosalind.info/problems/sseq/"
status = "solved"
asserted = true
note = "A subsequence rather than a substring — the characters need not be contiguous. That is the right model for a motif split across exons, since the intervening introns are spliced out before the protein is made."
topics = ["motifs"]

[[problem]]
id = "PDST"
title = "Creating a Distance Matrix"
file = "examples/pdst.bl"
url = "https://rosalind.info/problems/pdst/"
status = "solved"
asserted = true
note = "Pairwise p-distance: the fraction of positions at which two sequences differ. It is the crude measure HAMM warns about, applied to every pair, and it feeds the tree-building problems that follow."
topics = ["phylogeny", "distance"]

[[problem]]
id = "ASMQ"
title = "Assessing Assembly Quality with N50 and N75"
file = "examples/asmq.bl"
url = "https://rosalind.info/problems/asmq/"
status = "solved"
asserted = true
note = "N50 is the contig length at which half the assembly sits in contigs that long or longer. It is the standard summary and a gameable one: joining contigs wrongly raises it, so a high N50 is evidence of a long assembly rather than a correct one."
topics = ["assembly"]

[[problem]]
id = "ORF"
title = "Open Reading Frames"
file = "examples/orf.bl"
url = "https://rosalind.info/problems/orf/"
status = "solved"
asserted = true
note = "Six frames, not three — the gene may sit on either strand, and there is no way to tell from the sequence which. Each frame is scanned from every start codon to the first stop."
topics = ["orf", "translation"]

[[problem]]
id = "LEXV"
title = "Ordering Strings of Varying Length Lexicographically"
file = "examples/lexv.bl"
url = "https://rosalind.info/problems/lexv/"
status = "solved"
asserted = true
note = "Ordering strings of unequal length, where a prefix sorts before anything extending it. Ordinary lexicographic order on padded strings gets this wrong, which is the whole exercise."
topics = ["combinatorics", "strings"]

[[problem]]
id = "SETO"
title = "Introduction to Set Operations"
file = "examples/seto.bl"
url = "https://rosalind.info/problems/seto/"
status = "solved"
asserted = true
note = "Set operations as groundwork. Worth having explicitly because several later problems phrase their answer as a complement or an intersection, and getting the universe wrong is a common way to be quietly off by a few elements."
topics = ["sets"]

[[problem]]
id = "LCSQ"
title = "Finding a Shared Spliced Motif"
file = "examples/lcsq.bl"
url = "https://rosalind.info/problems/lcsq/"
status = "solved"
asserted = true
note = "Any longest common subsequence is a valid answer, so the assertion checks the length and that the motif really is a subsequence of both strings."
topics = ["dynamic-programming", "motifs"]

[[problem]]
id = "KMP"
title = "Speeding Up Motif Finding"
file = "examples/kmp.bl"
url = "https://rosalind.info/problems/kmp/"
status = "solved"
asserted = true
note = "The failure array records, for each prefix, the longest proper prefix that is also a suffix — so a mismatch can resume without re-reading the text. That is what makes matching linear rather than quadratic, and it is the same insight the trie and suffix-array problems generalise."
topics = ["strings", "motifs"]

[[problem]]
id = "DBRU"
title = "Constructing a De Bruijn Graph"
file = "examples/dbru.bl"
url = "https://rosalind.info/problems/dbru/"
status = "solved"
asserted = true
note = "Reads become edges rather than nodes, which turns assembly from a Hamiltonian path problem into an Eulerian one. GRPH shows the alternative; this is the construction real assemblers are built on."
topics = ["graphs", "assembly"]

[[problem]]
id = "ASPC"
title = "Introduction to Alternative Splicing"
file = "examples/aspc.bl"
url = "https://rosalind.info/problems/aspc/"
status = "solved"
asserted = true
note = "Summing binomial coefficients, motivated by alternative splicing: one gene yields many proteins depending on which exons are kept. The count grows fast enough that the modulus is doing real work."
topics = ["combinatorics"]

[[problem]]
id = "CORR"
title = "Error Correction in Reads"
file = "examples/corr.bl"
url = "https://rosalind.info/problems/corr/"
status = "solved"
asserted = true
note = "Assumes a correct read appears at least twice and an erroneous one exactly once — which is what read depth buys and why coverage matters. Reverse complements count as the same read, since strand is not recorded."
topics = ["sequence", "error-correction"]

[[problem]]
id = "SCSP"
title = "Interleaving Two Motifs"
file = "examples/scsp.bl"
url = "https://rosalind.info/problems/scsp/"
status = "solved"
asserted = true
note = "Any shortest common supersequence is valid, so the assertion checks the length and that both inputs are subsequences of the result."
topics = ["dynamic-programming", "motifs"]

[[problem]]
id = "EVAL"
title = "Expected Number of Restriction Sites"
file = "examples/eval.bl"
url = "https://rosalind.info/problems/eval/"
status = "solved"
asserted = true
note = "The expected number of times a motif appears in a random sequence, which is what makes an observed count interesting or unremarkable. Without a baseline, finding a site says nothing at all."
topics = ["probability", "gc-content"]

[[problem]]
id = "LONG"
title = "Genome Assembly as Shortest Superstring"
file = "examples/long.bl"
url = "https://rosalind.info/problems/long/"
status = "solved"
asserted = true
note = "Shortest superstring is NP-hard in general. This is solvable only because the problem guarantees every pair overlaps by more than half their length, which makes the correct overlap unique and a greedy merge safe. GREP shows what happens when that guarantee is dropped."
topics = ["assembly"]

[[problem]]
id = "KMER"
title = "k-Mer Composition"
file = "examples/kmer.bl"
url = "https://rosalind.info/problems/kmer/"
status = "solved"
asserted = true
note = "The official answer is a 256-entry array. Rather than restate it, the assertion checks the ordering endpoints, that the counts total the number of windows, and cross-checks an entry by independent counting — which is what an ordering or lookup mistake would break."
topics = ["sequence", "kmers"]

[[problem]]
id = "EBIN"
title = "Wright-Fisher's Expected Behavior"
file = "examples/ebin.bl"
url = "https://rosalind.info/problems/ebin/"
status = "solved"
asserted = true
note = "Expected allele counts under Wright-Fisher, where expectation is linear and so the answer is a sum of binomial means. WFMD gives the distribution this summarises."
topics = ["probability"]

[[problem]]
id = "SPEC"
title = "Inferring Protein from Spectrum"
file = "examples/spec.bl"
url = "https://rosalind.info/problems/spec/"
status = "solved"
asserted = true
note = "The answer is derived from the spectrum's consecutive differences (186.079 W, 131.040 M, 128.059 Q, 71.037 A) rather than restated from memory, and the assertion re-checks each residue against its own gap."
topics = ["mass-spectrometry", "protein"]

[[problem]]
id = "ROOT"
title = "Counting Rooted Binary Trees"
file = "examples/root.bl"
url = "https://rosalind.info/problems/root/"
status = "solved"
asserted = true
note = "Rooted binary trees on n leaves number (2n-3)!!, which passes a billion by n=11. That growth is why phylogenetics searches tree space rather than enumerating it."
topics = ["phylogeny", "combinatorics"]

[[problem]]
id = "CUNR"
title = "Counting Unrooted Binary Trees"
file = "examples/cunr.bl"
url = "https://rosalind.info/problems/cunr/"
status = "solved"
asserted = true
note = "The unrooted count, (2n-5)!!, which is the rooted count one step back — a rooted tree is an unrooted one with a root placed on some edge. EUBT constructs these rather than counting them."
topics = ["phylogeny", "combinatorics"]

[[problem]]
id = "MOTZ"
title = "Motzkin Numbers and RNA Secondary Structures"
file = "examples/motz.bl"
url = "https://rosalind.info/problems/motz/"
status = "solved"
asserted = true
note = "Motzkin numbers drop CAT's requirement that every base pairs, which is the more realistic model: real RNA leaves plenty unpaired. RNAS goes further and adds wobble bonds and a minimum hairpin length."
topics = ["combinatorics", "rna-structure", "dynamic-programming"]

[[problem]]
id = "INDC"
title = "Independent Segregation of Chromosomes"
file = "examples/indc.bl"
url = "https://rosalind.info/problems/indc/"
status = "solved"
asserted = true
note = "Rosalind allows 0.001 absolute error and its printed sample rounds some entries differently, so the assertion pins the exact endpoints — log10(1023/1024) and log10(1/1024) — and that the tail never increases, rather than a rounding-dependent array."
topics = ["probability", "genetics"]

[[problem]]
id = "TRIE"
title = "Introduction to Pattern Matching"
file = "examples/trie.bl"
url = "https://rosalind.info/problems/trie/"
status = "solved"
asserted = true
note = "Patterns sharing a prefix share a path, so the text is scanned once regardless of how many patterns are sought. That is the property that makes trie matching worth building, and BA9A and BA9B use it directly."
topics = ["strings", "trie"]

[[problem]]
id = "WFMD"
title = "The Wright-Fisher Model of Genetic Drift"
file = "examples/wfmd.bl"
url = "https://rosalind.info/problems/wfmd/"
status = "solved"
asserted = true
note = "Genetic drift: allele frequencies move at random in a finite population, and an allele can be lost or fixed with no selection involved at all. It is the null model everything claiming selection has to be tested against."
topics = ["probability", "genetics"]

[[problem]]
id = "NWCK"
title = "Distances in Trees"
file = "examples/nwck.bl"
url = "https://rosalind.info/problems/nwck/"
status = "solved"
asserted = true
note = "Carries a small Newick parser written in BioLang — phylo_tree() renders SVG and nw_to_distance_matrix() takes a table, so neither parses Newick."
topics = ["phylogeny", "newick"]

[[problem]]
id = "NKEW"
title = "Newick Format with Edge Weights"
file = "examples/nkew.bl"
url = "https://rosalind.info/problems/nkew/"
status = "solved"
asserted = true
note = "The NWCK parser extended to read ':length' suffixes, walking to the lowest common ancestor rather than breadth-first."
topics = ["phylogeny", "newick"]

[[problem]]
id = "CTBL"
title = "Creating a Character Table"
file = "examples/ctbl.bl"
url = "https://rosalind.info/problems/ctbl/"
status = "solved"
asserted = true
note = "A character table records the splits a set of taxa admits. CHBP inverts it back into a tree, which works only because the splits of a consistent table are nested or disjoint and never crossing."
topics = ["phylogeny", "newick"]

[[problem]]
id = "SPTD"
title = "Phylogeny Comparison with Split Distance"
file = "examples/sptd.bl"
url = "https://rosalind.info/problems/sptd/"
status = "solved"
asserted = true
note = "The two trees here share no nontrivial split, so the distance is 2(n-3) = 6; the splits of each are printed so that is checkable by eye. The assertion also requires a tree compared with itself to give 0, which tests the canonical split orientation rather than just the arithmetic."
topics = ["phylogeny", "newick"]

[[problem]]
id = "CONV"
title = "Comparing Spectra with the Spectral Convolution"
file = "examples/conv.bl"
url = "https://rosalind.info/problems/conv/"
status = "solved"
asserted = true
note = "Both spectra repeat a mass, so the winning difference (149.06586) arises four ways; the example prints that reasoning. The assertion also pins the three hand-checked occurrences of 85.03163 and the size of the convolution."
topics = ["mass-spectrometry"]

[[problem]]
id = "PCOV"
title = "Genome Assembly with Perfect Coverage"
file = "examples/pcov.bl"
url = "https://rosalind.info/problems/pcov/"
status = "solved"
asserted = true
note = "Perfect coverage makes the De Bruijn graph a single cycle, so it is walked directly rather than searched. The assertion checks every read appears in the doubled string, which is what cyclic containment means."
topics = ["assembly", "graphs"]

[[problem]]
id = "SIMS"
title = "Finding a Motif with Modifications"
file = "examples/sims.bl"
url = "https://rosalind.info/problems/sims/"
status = "solved"
asserted = true
slow = true
note = "Fitting alignment by dynamic programming over two rolling rows, written in place with indexed assignment. Rebuilding each row with push() took about 40 s; this takes about 18 s."
topics = ["alignment", "motifs"]

[[problem]]
id = "MEND"
title = "Inferring Genotype from a Pedigree"
file = "examples/mend.bl"
url = "https://rosalind.info/problems/mend/"
status = "solved"
asserted = true
note = "The distribution was worked out by hand up the pedigree before being asserted, and the example prints that derivation. The assertion also requires the three probabilities to sum to one."
topics = ["phylogeny", "genetics", "probability"]

[[problem]]
id = "LING"
title = "Linguistic Complexity of a Genome"
file = "examples/ling.bl"
url = "https://rosalind.info/problems/ling/"
status = "solved"
asserted = true
note = "The fraction of substrings that actually occur out of all that could. Repetitive sequence scores low because it reuses the same substrings — which is exactly what makes repeats hard to assemble through, as GREP demonstrates."
topics = ["strings", "complexity"]

[[problem]]
id = "RSTR"
title = "Matching Random Motifs"
file = "examples/rstr.bl"
url = "https://rosalind.info/problems/rstr/"
status = "solved"
asserted = true
note = "Derived rather than recalled: the motif has four weak and four strong bases, so p = 0.2^4 x 0.3^4 = 1.296e-05 and 1-(1-p)^90 = 0.00117. The assertion pins p as well as the answer."
topics = ["probability", "motifs"]

[[problem]]
id = "EDTA"
title = "Edit Distance Alignment"
file = "examples/edta.bl"
url = "https://rosalind.info/problems/edta/"
status = "solved"
asserted = true
note = "Any optimal alignment is valid, so the assertion checks the distance and that the two rows are equal length, recover the inputs once gaps are removed, and differ in exactly `distance` positions."
topics = ["alignment", "edit-distance"]

[[problem]]
id = "CTEA"
title = "Counting Optimal Alignments"
file = "examples/ctea.bl"
url = "https://rosalind.info/problems/ctea/"
status = "solved"
asserted = true
note = "Two passes: the edit-distance table, then a count of the paths achieving it. The distance agrees with EDIT on the same pair of strings."
topics = ["alignment", "dynamic-programming", "combinatorics"]

[[problem]]
id = "FOUN"
title = "The Founder Effect and Genetic Drift"
file = "examples/foun.bl"
url = "https://rosalind.info/problems/foun/"
status = "solved"
asserted = true
note = "The first generation was derived by hand — from one copy, (7/8)^8 = 0.343609 so log10 = -0.463936 — and the assertion pins that plus the requirement that loss never becomes less likely over time."
topics = ["probability", "genetics"]

[[problem]]
id = "GCON"
title = "Global Alignment with Constant Gap Penalty"
file = "examples/gcon.bl"
url = "https://rosalind.info/problems/gcon/"
status = "solved"
asserted = true
note = "The affine recurrence with a zero extension cost. Cross-checked against GLOB, which scores the same pair at 8 with a per-residue gap of 5."
topics = ["alignment", "blosum62"]

[[problem]]
id = "PRSM"
title = "Matching a Spectrum to a Protein"
file = "examples/prsm.bl"
url = "https://rosalind.info/problems/prsm/"
status = "solved"
asserted = true
note = "GSDMQS ties with IASMQS at multiplicity 3, so the assertion requires the reported protein to be one of the maximal ones rather than a single fixed string."
topics = ["mass-spectrometry", "protein"]

[[problem]]
id = "PDPL"
title = "Creating a Restriction Map"
file = "examples/pdpl.bl"
url = "https://rosalind.info/problems/pdpl/"
status = "solved"
asserted = true
note = "Self-verifying: the assertion recomputes the pairwise differences of the reconstructed points and requires them to reproduce the input multiset exactly, which is stronger than matching one printed answer."
topics = ["combinatorics", "restriction-mapping"]

[[problem]]
id = "CSET"
title = "Fixing an Inconsistent Character Set"
file = "examples/cset.bl"
url = "https://rosalind.info/problems/cset/"
status = "solved"
asserted = true
note = "Any character whose removal restores consistency is a valid answer, so the assertion checks the four-gamete condition on the result and that the input really was inconsistent, rather than naming one row."
topics = ["phylogeny", "character-tables"]

[[problem]]
id = "LREP"
title = "Finding the Longest Multiple Repeat"
file = "examples/lrep.bl"
url = "https://rosalind.info/problems/lrep/"
status = "solved"
asserted = true
note = "Rosalind supplies the suffix tree as an edge list, so nothing has to build one — the work is counting leaves below each node, which is how often the path to it occurs."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "MREP"
title = "Identifying Maximal Repeats"
file = "examples/mrep.bl"
url = "https://rosalind.info/problems/mrep/"
status = "solved"
asserted = true
note = "Read off the LCP array: a value of at least 20 is a candidate repeat, kept when its occurrences do not all share the character before them."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "LAFF"
title = "Local Alignment with Affine Gap Penalty"
file = "examples/laff.bl"
url = "https://rosalind.info/problems/laff/"
status = "solved"
asserted = true
note = "One call. Local mode and affine gaps were both already in align(); what was missing until recently was any way to reach a substitution matrix from it."
topics = ["alignment"]

[[problem]]
id = "SMGB"
title = "Semiglobal Alignment"
file = "examples/smgb.bl"
url = "https://rosalind.info/problems/smgb/"
status = "solved"
asserted = true
note = "Semiglobal is one of the two alignment modes added for this pack; before that the problem could not be expressed at all."
topics = ["alignment"]

[[problem]]
id = "MGAP"
title = "Maximizing the Gap Symbols of an Optimal Alignment"
file = "examples/mgap.bl"
url = "https://rosalind.info/problems/mgap/"
status = "solved"
asserted = true
note = "The scoring is deliberately unspecified, which is the hint: a maximum-score alignment matches as much as it can, so the answer falls out of the longest common subsequence."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "CSTR"
title = "Creating a Character Table from Genetic Strings"
file = "examples/cstr.bl"
url = "https://rosalind.info/problems/cstr/"
status = "solved"
asserted = true
note = "A split is nontrivial only when both sides hold at least two strings; a position where one string differs from all the others separates nothing. Which state is written as 1 is arbitrary, so the assertion accepts a row or its complement."
topics = ["phylogeny", "character-tables"]

[[problem]]
id = "SUFF"
title = "Encoding Suffix Trees"
file = "examples/suff.bl"
url = "https://rosalind.info/problems/suff/"
status = "solved"
asserted = true
note = "Built from the suffix array and LCP array rather than by collapsing a trie. Both give the same tree; a trie of all suffixes has O(n^2) nodes first, whereas the arrays are linear — which is why aligners store the arrays and never materialise the tree."
topics = ["strings", "suffix-structures"]

[[problem]]
id = "SGRA"
title = "Using the Spectrum Graph to Infer Peptides"
file = "examples/sgra.bl"
url = "https://rosalind.info/problems/sgra/"
status = "solved"
asserted = true
note = "Monoisotopic masses, so differences are matched within a tolerance rather than exactly. The graph is a DAG since masses only increase, so the longest path is one scan in sorted order instead of an exponential search."
topics = ["mass-spectrometry", "graphs"]

[[problem]]
id = "FULL"
title = "Inferring Peptide from Full Spectrum"
file = "examples/full.bl"
url = "https://rosalind.info/problems/full/"
status = "solved"
asserted = true
note = "A peptide fragments from both ends at once, so a b-ion and its y-ion sum to the parent mass and the list mixes them unlabelled. It does not matter which is which — taking an ion spends its complement, since a prefix and its suffix are one event and cannot both extend the chain."
topics = ["mass-spectrometry"]

[[problem]]
id = "ALPH"
title = "Alignment-Based Phylogeny"
file = "examples/alph.bl"
url = "https://rosalind.info/problems/alph/"
status = "solved"
asserted = true
note = "Small parsimony with the gap as a fifth symbol rather than a missing value — in an alignment a gap is evidence that an indel happened, and treating it as unknown would make every column containing one free. Finds a different labelling of equal score, so the assertion recounts the changes."
topics = ["phylogeny", "alignment"]

[[problem]]
id = "GASM"
title = "Genome Assembly Using Reads"
file = "examples/gasm.bl"
url = "https://rosalind.info/problems/gasm/"
status = "solved"
asserted = true
note = "A read gives no clue which strand it came from, so the graph holds every read and its reverse complement and falls into two mirror cycles. Returns AATCTGT — a rotation of the reverse complement of GATTACA, which the assertion checks up to both rotation and strand."
topics = ["assembly", "graphs"]

[[problem]]
id = "MULT"
title = "Multiple Alignment"
file = "examples/mult.bl"
url = "https://rosalind.info/problems/mult/"
status = "solved"
asserted = true
note = "Four sequences need a hypercube and 2^k-1 moves out of every cell — fifteen here, against three for a pairwise alignment. Exact multiple alignment costs O(n^k), which is why every tool that aligns hundreds of sequences is approximating."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "GREP"
title = "Genome Assembly with Perfect Coverage and Repeats"
file = "examples/grep.bl"
url = "https://rosalind.info/problems/grep/"
status = "solved"
asserted = true
note = "PCOV returns one answer; this is the honest version. Repeats make the Eulerian cycle non-unique and all six cycles are genomes consistent with the reads — so the reads do not determine the chromosome, and reporting one would be picking arbitrarily."
topics = ["assembly", "graphs"]

[[problem]]
id = "MPRT"
title = "Finding a Protein Motif"
file = "examples/mprt.bl"
url = "https://rosalind.info/problems/mprt/"
status = "solved"
network = true
asserted = true
note = "Fetches from UniProt, so it runs in the advisory job rather than the hermetic gate. The motif matcher itself is asserted offline — N{P}[ST]{P} has alternatives and exclusions, so it is a pattern rather than a substring search."
topics = ["motifs", "databases"]

[[problem]]
id = "OSYM"
title = "Isolating Symbols in Alignments"
file = "examples/osym.bl"
url = "https://rosalind.info/problems/osym/"
status = "solved"
asserted = true
note = "The best alignment through a given pairing is the best way of reaching it plus the best way of leaving it, so one forward table and one backward table answer all 49 pairs at once — the same trick BA5K uses to find a middle edge."
topics = ["alignment", "dynamic-programming"]

[[problem]]
id = "ITWV"
title = "Finding Disjoint Motifs in a Gene"
file = "examples/itwv.bl"
url = "https://rosalind.info/problems/itwv/"
status = "solved"
asserted = true
note = "Two motifs competing for the same characters, which is what makes this different from finding each separately. Every reachable state must consume the current character or the window ends — carrying one forward unconsumed would let the motifs match unrelated parts of the sequence."
topics = ["motifs", "dynamic-programming"]

[[problem]]
id = "CNTQ"
title = "Counting Quartets"
file = "examples/cntq.bl"
url = "https://rosalind.info/problems/cntq/"
status = "solved"
asserted = true
note = "The answer is C(n,4), and the reason matters more than the number: in a fully resolved tree any four taxa are separated into two pairs by some edge, so the shape never enters into it. The assertion enumerates all 15 subsets and confirms it rather than trusting the formula."
topics = ["phylogeny", "combinatorics"]

[[problem]]
id = "QRT"
title = "Quartets"
file = "examples/qrt.bl"
url = "https://rosalind.info/problems/qrt/"
status = "solved"
asserted = true
note = "An 'x' means not scored, not a third state — so a partial character still separates the taxa it did see, and missing data does not make it useless. Quartets are recorded canonically because neither side nor the order within a side carries meaning, and two characters often support the same one."
topics = ["phylogeny"]

[[problem]]
id = "CHBP"
title = "Character-Based Phylogeny"
file = "examples/chbp.bl"
url = "https://rosalind.info/problems/chbp/"
status = "solved"
asserted = true
note = "The inverse of CTBL. It works because a consistent table's splits are laminar — any two nested or disjoint, never crossing — and a laminar family is exactly a tree. Returns a differently-rooted Newick, so the assertion compares induced splits rather than a formatting choice."
topics = ["phylogeny"]

[[problem]]
id = "EUBT"
title = "Enumerating Unrooted Binary Trees"
file = "examples/eubt.bl"
url = "https://rosalind.info/problems/eubt/"
status = "solved"
asserted = true
note = "Built by insertion: every unrooted binary tree arises exactly once by splitting an edge and hanging the next taxon off it, which is why the count is (2n-5)!! — fifteen trees at n=5, over two million at n=10. That growth is why nobody enumerates trees to find the best one."
topics = ["phylogeny", "combinatorics"]

[[problem]]
id = "QRTD"
title = "Quartet Distance"
file = "examples/qrtd.bl"
url = "https://rosalind.info/problems/qrtd/"
status = "solved"
asserted = true
note = "Quartets degrade gracefully where splits do not: moving one taxon changes a handful of quartets but can destroy every split at once. Asserted to be zero between a tree and itself, which is the identity any distance must satisfy."
topics = ["phylogeny"]

[[problem]]
id = "RNAS"
title = "Wobble Bonding and RNA Secondary Structures"
file = "examples/rnas.bl"
url = "https://rosalind.info/problems/rnas/"
status = "solved"
asserted = true
note = "Real RNA pairs U-G nearly as readily as A-U, so a count excluding wobble understates what a molecule can fold into. Memoised with has_key — contains(keys(memo), k) rebuilds the key list on every probe and would make the lookup the bottleneck the memo was meant to remove."
topics = ["rna", "dynamic-programming"]

[[problem]]
id = "KSIM"
title = "Finding All Similar Motifs"
file = "examples/ksim.bl"
url = "https://rosalind.info/problems/ksim/"
status = "solved"
asserted = true
note = "A binding site is a tendency rather than a fixed string, so exact search finds a fraction of real sites — the motif here does not occur exactly at all. Checks every (start, length) pair directly, which is O(n^2) and stated as such: a 50 kbp genome would need the fitting-alignment form instead."
topics = ["motifs", "alignment"]

[[problem]]
id = "RSUB"
title = "Identifying Reversing Substitutions"
file = "examples/rsub.bl"
url = "https://rosalind.info/problems/rsub/"
status = "solved"
asserted = true
note = "A site that mutates and mutates back looks, from the tips alone, as though nothing happened — which is exactly what makes distant relationships hard to recover. Only the internal labels reveal it, which is why the problem supplies them."
topics = ["phylogeny"]

[[problem]]
id = "REAR"
title = "Reversal Distance"
file = "examples/rear.bl"
url = "https://rosalind.info/problems/rear/"
status = "solved"
asserted = true
note = "Where BA6C's 2-break distance had a closed form, this has none at size 10 and must be searched: 45 reversals per step, 3.6 million reachable orders, distance reaching 9. The builtin searches from both ends and meets in the middle, so each side only reaches depth 4 or 5."
topics = ["rearrangements", "search"]

[[problem]]
id = "SORT"
title = "Sorting by Reversals"
file = "examples/sort.bl"
url = "https://rosalind.info/problems/sort/"
status = "solved"
asserted = true
note = "REAR asks how far apart two gene orders are; this asks for the route, which is what actually says how the rearrangement happened. The assertion applies the reversals and checks they produce the target — a plausible list that does not sort is the failure this invites."
topics = ["rearrangements", "search"]
