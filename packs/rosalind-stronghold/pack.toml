file = "examples/pcov.bl"
url = "https://rosalind.info/problems/pcov/"
status = "solved"
asserted = true
note = "Perfect coverage makes the De Bruijn graph a single cycle, so it is walked directly rather than searched. The assertion checks every read appears in the doubled string, which is what cyclic containment means."
topics = ["assembly", "graphs"]

