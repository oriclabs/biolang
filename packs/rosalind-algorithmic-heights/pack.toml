# BioLang example pack: Rosalind — Algorithmic Heights
#
# The fourth Rosalind track. Unlike the other three it is not bioinformatics at
# all: it is the standard algorithms course — sorting, heaps, graph search,
# shortest paths. That makes it a different kind of test of the language. There
# is no builtin to reach for, so every problem is written in BioLang itself.
#
# See packs/rosalind-armory/pack.toml for the field meanings.

[pack]
id = "rosalind-algorithmic-heights"
name = "Rosalind — Algorithmic Heights"
version = "0.1.0"
track = "algorithmic-heights"
description = "The Algorithmic Heights track: sorting, heaps, graph search and shortest paths, written in BioLang rather than called from a builtin."
list_url = "https://rosalind.info/problems/list-view/?location=algorithmic-heights"
requires = ">=0.4"

license = "MIT"
# Rosalind asks that solutions not be posted outside their site. The docs
# pages and the published pack bundle both honour that; CI still builds and
# runs every file, and `packs/` is unchanged.
publish_source = false
statements_license = "Problem statements © rosalind.info — paraphrased, not reproduced. Titles, published sample datasets and expected answers are reproduced only as far as verification needs them. Every problem links to its rosalind.info page."

[[problem]]
id = "FIBO"
title = "Fibonacci Numbers"
file = "examples/fibo.bl"
url = "https://rosalind.info/problems/fibo/"
status = "solved"
asserted = true
topics = ["recursion", "dynamic-programming"]

[[problem]]
id = "BINS"
title = "Binary Search"
file = "examples/bins.bl"
url = "https://rosalind.info/problems/bins/"
status = "solved"
asserted = true
topics = ["searching"]

[[problem]]
id = "DEG"
title = "Degree Array"
file = "examples/deg.bl"
url = "https://rosalind.info/problems/deg/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "INS"
title = "Insertion Sort"
file = "examples/ins.bl"
url = "https://rosalind.info/problems/ins/"
status = "solved"
asserted = true
note = "The swap count is the number of inversions, so the same loop answers INV as well. Sorts in place, which the index assignment added for these packs is what makes possible."
topics = ["sorting"]

[[problem]]
id = "DDEG"
title = "Double-Degree Array"
file = "examples/ddeg.bl"
url = "https://rosalind.info/problems/ddeg/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "MAJ"
title = "Majority Element"
file = "examples/maj.bl"
url = "https://rosalind.info/problems/maj/"
status = "solved"
asserted = true
note = "Writing this found that `{}` parsed as an empty block and evaluated to nil, so a tally could not be opened the obvious way. Fixed in the parser; `{}` in value position is now an empty map."
topics = ["arrays"]

[[problem]]
id = "MER"
title = "Merge Two Sorted Arrays"
file = "examples/mer.bl"
url = "https://rosalind.info/problems/mer/"
status = "solved"
asserted = true
topics = ["sorting"]

[[problem]]
id = "2SUM"
title = "2SUM"
file = "examples/2sum.bl"
url = "https://rosalind.info/problems/2sum/"
status = "solved"
asserted = true
note = "Any valid pair is accepted, so the answers are checked against the definition rather than against the sample string: the scan reaches 8 and -8 first and reports 1 5 where the sample reports 2 4."
topics = ["arrays"]

[[problem]]
id = "BFS"
title = "Breadth-First Search"
file = "examples/bfs.bl"
url = "https://rosalind.info/problems/bfs/"
status = "solved"
asserted = true
topics = ["graphs", "shortest-paths"]

[[problem]]
id = "CC"
title = "Connected Components"
file = "examples/cc.bl"
url = "https://rosalind.info/problems/cc/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "HEA"
title = "Building a Heap"
file = "examples/hea.bl"
url = "https://rosalind.info/problems/hea/"
status = "solved"
asserted = true
note = "Any permutation with the heap property is accepted, so the property is what is asserted. Floyd's construction reaches 7 3 5 1 2 where the sample shows 7 5 1 3 2."
topics = ["heaps", "sorting"]

[[problem]]
id = "MS"
title = "Merge Sort"
file = "examples/ms.bl"
url = "https://rosalind.info/problems/ms/"
status = "solved"
asserted = true
topics = ["sorting", "recursion"]

[[problem]]
id = "PAR"
title = "2-Way Partition"
file = "examples/par.bl"
url = "https://rosalind.info/problems/par/"
status = "solved"
asserted = true
note = "Any valid partition is accepted, so the three conditions are asserted rather than one arrangement."
topics = ["sorting"]

[[problem]]
id = "3SUM"
title = "3SUM"
file = "examples/3sum.bl"
url = "https://rosalind.info/problems/3sum/"
status = "solved"
asserted = true
topics = ["arrays"]

[[problem]]
id = "BIP"
title = "Testing Bipartiteness"
file = "examples/bip.bl"
url = "https://rosalind.info/problems/bip/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "DAG"
title = "Testing Acyclicity"
file = "examples/dag.bl"
url = "https://rosalind.info/problems/dag/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "DIJ"
title = "Dijkstra's Algorithm"
file = "examples/dij.bl"
url = "https://rosalind.info/problems/dij/"
status = "solved"
asserted = true
topics = ["graphs", "shortest-paths"]

[[problem]]
id = "HS"
title = "Heap Sort"
file = "examples/hs.bl"
url = "https://rosalind.info/problems/hs/"
status = "solved"
asserted = true
topics = ["sorting", "heaps"]

[[problem]]
id = "INV"
title = "Counting Inversions"
file = "examples/inv.bl"
url = "https://rosalind.info/problems/inv/"
status = "solved"
asserted = true
note = "Counted during the merge rather than pairwise, so this is n log n where INS's swap count is quadratic. The two problems ask for the same number."
topics = ["sorting", "divide-and-conquer"]

[[problem]]
id = "PAR3"
title = "3-Way Partition"
file = "examples/par3.bl"
url = "https://rosalind.info/problems/par3/"
status = "solved"
asserted = true
note = "Dutch national flag. Any valid arrangement is accepted, so the three regions are asserted rather than one output; this one happens to match the sample."
topics = ["sorting"]

[[problem]]
id = "SQ"
title = "Square in a Graph"
file = "examples/sq.bl"
url = "https://rosalind.info/problems/sq/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "BF"
title = "Bellman-Ford Algorithm"
file = "examples/bf.bl"
url = "https://rosalind.info/problems/bf/"
status = "solved"
asserted = true
topics = ["graphs", "shortest-paths"]

[[problem]]
id = "CTE"
title = "Shortest Cycle Through a Given Edge"
file = "examples/cte.bl"
url = "https://rosalind.info/problems/cte/"
status = "solved"
asserted = true
topics = ["graphs", "shortest-paths"]

[[problem]]
id = "MED"
title = "Median"
file = "examples/med.bl"
url = "https://rosalind.info/problems/med/"
status = "solved"
asserted = true
note = "Quickselect: recurses into one side only, so it answers the question without sorting. Cross-checked against sorting in the assertion."
topics = ["searching", "selection"]

[[problem]]
id = "PS"
title = "Partial Sort"
file = "examples/ps.bl"
url = "https://rosalind.info/problems/ps/"
status = "solved"
asserted = true
topics = ["sorting", "selection"]

[[problem]]
id = "TS"
title = "Topological Sorting"
file = "examples/ts.bl"
url = "https://rosalind.info/problems/ts/"
status = "solved"
asserted = true
note = "Any order with every edge pointing forwards is accepted, so that property is asserted rather than the sample text."
topics = ["graphs", "ordering"]

[[problem]]
id = "HDAG"
title = "Hamiltonian Path in DAG"
file = "examples/hdag.bl"
url = "https://rosalind.info/problems/hdag/"
status = "solved"
asserted = true
note = "Hard in general, easy on a DAG: a Hamiltonian path exists exactly when consecutive vertices of the topological order are joined by an edge."
topics = ["graphs", "ordering"]

[[problem]]
id = "NWC"
title = "Negative Weight Cycle"
file = "examples/nwc.bl"
url = "https://rosalind.info/problems/nwc/"
status = "solved"
asserted = true
note = "Every distance starts at 0, not just vertex 1, so a cycle unreachable from vertex 1 is still found."
topics = ["graphs", "shortest-paths"]

[[problem]]
id = "QS"
title = "Quick Sort"
file = "examples/qs.bl"
url = "https://rosalind.info/problems/qs/"
status = "solved"
asserted = true
topics = ["sorting", "recursion"]

[[problem]]
id = "SCC"
title = "Strongly Connected Components"
file = "examples/scc.bl"
url = "https://rosalind.info/problems/scc/"
status = "solved"
asserted = true
note = "Kosaraju, both passes iterative: a recursive depth-first search reads better but its depth is the length of a path, and the track allows 10^3 vertices."
topics = ["graphs"]

[[problem]]
id = "2SAT"
title = "2-Satisfiability"
file = "examples/2sat.bl"
url = "https://rosalind.info/problems/2sat/"
status = "solved"
asserted = true
note = "The hardest problem in the track and the one that pays off the rest: the implication graph is solved with the same Kosaraju pass SCC uses. Answers are checked by substituting them back into the formula, since any satisfying assignment is accepted."
topics = ["graphs", "satisfiability"]

[[problem]]
id = "GS"
title = "General Sink"
file = "examples/gs.bl"
url = "https://rosalind.info/problems/gs/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "SC"
title = "Semi-Connected Graph"
file = "examples/sc.bl"
url = "https://rosalind.info/problems/sc/"
status = "solved"
asserted = true
topics = ["graphs"]

[[problem]]
id = "SDAG"
title = "Shortest Paths in DAG"
file = "examples/sdag.bl"
url = "https://rosalind.info/problems/sdag/"
status = "solved"
asserted = true
note = "Relaxing once in topological order is linear, where Bellman-Ford needs n-1 rounds; acyclicity is what buys that."
topics = ["graphs", "shortest-paths"]
