name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  BIOLANG_NO_UPDATE_CHECK: "1"

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  lint:
    name: Rust lint (advisory)
    runs-on: ubuntu-latest
    # Advisory until the existing `cargo fmt` and clippy debt is cleared. Making
    # these blocking today would turn CI red on code this workflow never touched,
    # which is how a red build stops meaning anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  packs:
    name: Example packs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Manifest integrity first: a pack that lies about its own contents makes
      # every number below meaningless.
      - name: Verify pack manifests
        run: node scripts/verify-packs.mjs

      # Deploy builds the same artifacts from the same manifests, so a manifest
      # that cannot be built should fail here rather than on the way to Pages.
      - name: Build pack artifacts
        run: node scripts/build-packs.mjs

      # The committed WASM module can lag the Rust sources without any gate
      # noticing. Compare the workbench-owned module against its source; the
      # website publisher copies that same module when assembling lang.bio.
      - name: Check the browser runtime matches the source
        run: node scripts/check-wasm-fresh.mjs

      - name: Build the CLI
        run: cargo build -p bl-cli

      - name: Parse every pack example
        run: |
          find packs -name '*.bl' -print0 | xargs -0 ./target/debug/bl check

      # `bl test` only executes files that define `test_*` functions, so the
      # network-dependent examples declared in pack.toml are inert here. This
      # job must stay hermetic — an NCBI outage is not a BioLang regression.
      - name: Run pack assertions
        # Only the hermetic problems: verify-packs emits the asserted, non-network
        # set, because `bl test packs` would also run the ones that fetch from NCBI.
        run: ./target/debug/bl test $(node scripts/verify-packs.mjs --hermetic-files)

      # The four network-dependent answers, replayed from responses recorded
      # from the live services, so they are gated like every other answer
      # instead of riding in an advisory job nobody blocks on. need and mprt
      # carry the assertions; frmt and gbk assert nothing by design, so they
      # only have to run. A missing fixture is a 504, never a silent fall back
      # to the network. See scripts/api-fixtures.mjs.
      - name: Run network-dependent answers from recorded fixtures
        run: |
          node scripts/api-fixtures.mjs --serve &
          server=$!
          trap "kill $server" EXIT
          sleep 2
          export BIOLANG_NCBI_URL=http://127.0.0.1:8787/ncbi/entrez/eutils
          export BIOLANG_UNIPROT_URL=http://127.0.0.1:8787/uniprot
          ./target/debug/bl test packs/rosalind-armory/examples/need.bl \
                                 packs/rosalind-stronghold/examples/mprt.bl
          ./target/debug/bl run packs/rosalind-armory/examples/frmt.bl
          ./target/debug/bl run packs/rosalind-armory/examples/gbk.bl

      # Every other check runs an example on its own. A workbench session or a
      # REPL keeps state between runs, so a top-level `let` in one example
      # outlives it — BINS bound `keys` and MAJ then failed on `keys(counts)`
      # with "List is not callable". This runs each pack as one session.
      - name: Run each pack as one shared session
        run: node scripts/check-pack-session.mjs

      # Ratchet on examples/: no new breakage, and the known-broken list can
      # only shrink. See examples/known-broken.txt for why it is a ratchet
      # rather than a plain pass/fail gate.
      - name: Run every example
        run: node scripts/check-examples-run.mjs

  network-packs:
    name: Example packs (network)
    runs-on: ubuntu-latest
    # Never gates a pull request. Remote services rate-limit and go down, and a
    # red X for that trains people to ignore red X's.
    #
    # Since the recorded fixtures gate these same four answers in the packs job,
    # this job's remaining purpose is drift: it is how we learn that a recording
    # no longer matches what NCBI or UniProt actually return.
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bl-cli
      - name: Run network-dependent pack examples
        run: |
          set +e
          status=0
          for file in packs/rosalind-armory/examples/frmt.bl \
                      packs/rosalind-armory/examples/gbk.bl \
                      packs/rosalind-armory/examples/need.bl \
                      packs/rosalind-stronghold/examples/mprt.bl; do
            echo "=== $file"
            ./target/debug/bl run "$file" || status=1
          done
          exit $status

  desktop:
    name: Workbench checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bl-cli
      - name: Install workbench dependencies
        working-directory: desktop
        run: npm ci
      - name: Regenerate the help index and check it is committed
        working-directory: desktop
        run: |
          npm run generate:help
          git diff --exit-code -- src/generated \
            || (echo "help index is stale — run 'npm run generate:help' and commit"; exit 1)
      - name: Verify documented examples
        working-directory: desktop
        run: npm run check:examples
