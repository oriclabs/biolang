name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: biolang-linux-x86_64.tar.gz
            binary: bl
            lsp_binary: bl-lsp
          # Built on a native arm64 runner rather than cross-compiled from
          # x86_64. The dependency tree pulls in openssl-sys, ring, bzip2-sys
          # and zstd-sys, all of which compile C and would each need a working
          # cross toolchain. A native runner sidesteps that entirely, and
          # GitHub provides arm64 Linux runners at no cost for public repos.
          #
          # The docs and install.sh have referred to biolang-linux-aarch64.tar.gz
          # for some time; until now nothing built it, so that URL 404'd and
          # install.sh told arm64 Linux users to build from source.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: biolang-linux-aarch64.tar.gz
            binary: bl
            lsp_binary: bl-lsp
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: biolang-macos-x86_64.tar.gz
            binary: bl
            lsp_binary: bl-lsp
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: biolang-macos-aarch64.tar.gz
            binary: bl
            lsp_binary: bl-lsp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: biolang-windows-x86_64.zip
            binary: bl.exe
            lsp_binary: bl-lsp.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p bl-cli -p bl-lsp

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/
          cp target/${{ matrix.target }}/release/${{ matrix.lsp_binary }} dist/
          cp LICENSE dist/
          cp README.md dist/
          cd dist && tar czf ../${{ matrix.archive }} *

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.lsp_binary }}" dist/
          Copy-Item LICENSE dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          set -euo pipefail
          # download-artifact gives each artifact its own directory, so the paths
          # here are artifacts/<name>/<name>. Recording them verbatim produced
          # lines like
          #   <sha>  artifacts/biolang-windows-x86_64.zip/biolang-windows-x86_64.zip
          # which nobody can check with `sha256sum -c` beside a downloaded file.
          # Hash from inside each directory so the file records the bare name.
          : > checksums.sha256
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' f; do
              ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
            done | sort -k2 >> checksums.sha256
          cat checksums.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            checksums.sha256
