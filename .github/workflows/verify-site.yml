name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'books/**'
      - 'packs/**'
      - 'desktop/**'
      - 'scripts/build-packs.mjs'
      - 'scripts/lib/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install mdBook
        env:
          # Pinned. This step used to resolve "latest" through the unauthenticated
          # GitHub API, which is rate-limited per IP and shared across Actions
          # runners. When it was throttled, tag_name was absent, `tag` became the
          # empty string, and the URL collapsed to `download//mdbook--x86_64-...`,
          # which 404s. The whole deploy then failed for a reason unrelated to
          # anything in the commit. Pinning removes the API call, and makes the
          # docs build reproducible: "latest" also meant a new mdBook release
          # could change the published books with no commit behind it.
          MDBOOK_VERSION: v0.5.4
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv mdbook /usr/local/bin/
          mdbook --version

      - name: Build Tailwind CSS
        working-directory: website
        run: |
          npm ci
          npx tailwindcss -i src/input.css -o assets/styles.css --minify

      # wasm/builtins.json is gitignored, so it is absent from a fresh checkout
      # and the playground silently fell back to its regex allowlist — the very
      # drift the generated catalog exists to prevent. Regenerate it at deploy
      # time from the committed module so the two cannot disagree.
      - name: Generate the browser builtin catalog
        working-directory: website
        run: node tests/write_wasm_builtins.mjs

      # Publish the example packs as part of the site rather than as release
      # assets: the playground, the docs pages, and `bl packs` then all read one
      # URL (/packs/index.json), and a pack fix ships without cutting a release.
      - name: Build example packs
        run: |
          node scripts/build-packs.mjs --out website/packs
          # Sample data the documentation examples read, so a workbench
          # workspace has data/counts.csv and its siblings.
          node scripts/build-data-bundle.mjs --out website/packs
          node scripts/generate-pack-docs.mjs

      # The workbench already runs without Tauri (see desktop/src/browserRuntime.ts)
      # and vite is configured with a relative base, so the same build serves from
      # a subpath. `tsc && vite build` is invoked directly rather than via
      # `npm run build`, whose prebuild regenerates the help index and needs the
      # Rust CLI; those generated files are committed, and ci.yml already fails
      # if they are stale.
      - name: Build the browser workbench
        working-directory: desktop
        run: |
          npm ci
          npx tsc
          npx vite build
      - name: Stage the workbench
        run: |
          rm -rf website/workbench
          cp -r desktop/dist website/workbench

      - name: Install mdBook preprocessors
        run: cargo install mdbook-mermaid --no-default-features 2>/dev/null || true

      # Rebuilt rather than committed: the kit bundles the singlecell package
      # and the book's own scripts, so a committed copy goes stale the first
      # time either changes. Must run before the book build, which copies
      # src/downloads/ into the published site.
      - name: Build the single-cell starter kit
        run: python scripts/build-starter-kit.py

      - name: Build books
        run: |
          mdbook build books/language
          mdbook build books/practical-bioinformatics/book
          mdbook build books/biostatistics/book
          mdbook build books/single-cell-rna-seq
          mdbook build books/msmb/book
          mdbook build books/hbc-scrnaseq

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
